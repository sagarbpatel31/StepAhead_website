<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <mask id="screen-mask">
      <rect width="390" height="844" fill="white"/>
      <rect x="14" y="14" width="362" height="816" rx="44" ry="44" fill="black"/>
    </mask>
  </defs>
  <!-- Body with screen hole punched out -->
  <rect x="0" y="0" width="390" height="844" rx="54" ry="54" fill="#18122B" mask="url(#screen-mask)"/>
  <!-- Outer border ring -->
  <rect x="1.5" y="1.5" width="387" height="841" rx="53" ry="53" fill="none" stroke="#4a3580" stroke-width="3"/>
  <!-- Inner screen border -->
  <rect x="12" y="12" width="366" height="820" rx="46" ry="46" fill="none" stroke="#2a1f4e" stroke-width="2"/>
  <!-- Dynamic Island -->
  <rect x="140" y="22" width="110" height="36" rx="18" ry="18" fill="#18122B"/>
  <!-- Left buttons — mute -->
  <rect x="0" y="108" width="4" height="34" rx="2" fill="#4a3580"/>
  <!-- Left buttons — volume up -->
  <rect x="0" y="158" width="4" height="52" rx="2" fill="#4a3580"/>
  <!-- Left buttons — volume down -->
  <rect x="0" y="222" width="4" height="52" rx="2" fill="#4a3580"/>
  <!-- Right button — power -->
  <rect x="386" y="188" width="4" height="80" rx="2" fill="#4a3580"/>
</svg>
